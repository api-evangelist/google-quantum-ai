naftiko: 1.0.0-alpha2
info:
  label: Google Quantum Engine — Jobs
  description: Submit, monitor, update, cancel, and delete quantum jobs (executions of programs on Google's
    quantum processors). Also retrieves results and lifecycle events.
  tags:
  - Google Quantum AI
  - Quantum Engine
  - Jobs
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    GOOGLE_OAUTH_TOKEN: GOOGLE_OAUTH_TOKEN
capability:
  consumes:
  - type: http
    namespace: quantum-engine-jobs
    baseUri: https://quantum.googleapis.com
    description: Quantum Engine Jobs REST surface — create, list, get, update, cancel, delete jobs plus
      fetching results and lifecycle events.
    resources:
    - name: jobs
      path: /v1alpha1/projects/{projectId}/programs/{programId}/jobs
      operations:
      - name: createjob
        method: POST
        description: Submit a new quantum job.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: path
          type: string
          required: true
        - name: programId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          required: true
      - name: listjobs
        method: GET
        description: List quantum jobs in a program.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: path
          type: string
          required: true
        - name: programId
          in: path
          type: string
          required: true
        - name: filter
          in: query
          type: string
    - name: job
      path: /v1alpha1/projects/{projectId}/programs/{programId}/jobs/{jobId}
      operations:
      - name: getjob
        method: GET
        description: Retrieve a single quantum job.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: path
          type: string
          required: true
        - name: programId
          in: path
          type: string
          required: true
        - name: jobId
          in: path
          type: string
          required: true
      - name: updatejob
        method: PATCH
        description: Update mutable fields on a job.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: path
          type: string
          required: true
        - name: programId
          in: path
          type: string
          required: true
        - name: jobId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          required: true
      - name: deletejob
        method: DELETE
        description: Delete a quantum job.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: path
          type: string
          required: true
        - name: programId
          in: path
          type: string
          required: true
        - name: jobId
          in: path
          type: string
          required: true
    - name: jobCancel
      path: /v1alpha1/projects/{projectId}/programs/{programId}/jobs/{jobId}:cancel
      operations:
      - name: canceljob
        method: POST
        description: Cancel a queued or running quantum job.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: path
          type: string
          required: true
        - name: programId
          in: path
          type: string
          required: true
        - name: jobId
          in: path
          type: string
          required: true
    - name: jobResult
      path: /v1alpha1/projects/{projectId}/programs/{programId}/jobs/{jobId}/result
      operations:
      - name: getresult
        method: GET
        description: Retrieve the measurement result of a completed job.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: path
          type: string
          required: true
        - name: programId
          in: path
          type: string
          required: true
        - name: jobId
          in: path
          type: string
          required: true
    - name: jobEvents
      path: /v1alpha1/projects/{projectId}/programs/{programId}/jobs/{jobId}/events
      operations:
      - name: listevents
        method: GET
        description: List lifecycle events for a job.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: path
          type: string
          required: true
        - name: programId
          in: path
          type: string
          required: true
        - name: jobId
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      value: '{{env.GOOGLE_OAUTH_TOKEN}}'
      placement: header
  exposes:
  - type: rest
    namespace: quantum-engine-jobs-rest
    port: 8080
    description: REST adapter for Quantum Engine Jobs.
    resources:
    - path: /v1/projects/{projectId}/programs/{programId}/jobs
      name: jobs
      operations:
      - method: POST
        name: createjob
        call: quantum-engine-jobs.createjob
        with:
          projectId: rest.path.projectId
          programId: rest.path.programId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: listjobs
        call: quantum-engine-jobs.listjobs
        with:
          projectId: rest.path.projectId
          programId: rest.path.programId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/projects/{projectId}/programs/{programId}/jobs/{jobId}
      name: job
      operations:
      - method: GET
        name: getjob
        call: quantum-engine-jobs.getjob
        with:
          projectId: rest.path.projectId
          programId: rest.path.programId
          jobId: rest.path.jobId
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updatejob
        call: quantum-engine-jobs.updatejob
        with:
          projectId: rest.path.projectId
          programId: rest.path.programId
          jobId: rest.path.jobId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletejob
        call: quantum-engine-jobs.deletejob
        with:
          projectId: rest.path.projectId
          programId: rest.path.programId
          jobId: rest.path.jobId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: quantum-engine-jobs-mcp
    port: 9090
    transport: http
    description: MCP adapter for Quantum Engine Jobs.
    tools:
    - name: quantum-engine-create-job
      description: Submit a quantum job to a processor.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: quantum-engine-jobs.createjob
      with:
        projectId: tools.projectId
        programId: tools.programId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: quantum-engine-list-jobs
      description: List quantum jobs.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: quantum-engine-jobs.listjobs
      with:
        projectId: tools.projectId
        programId: tools.programId
      outputParameters:
      - type: object
        mapping: $.
    - name: quantum-engine-get-job
      description: Retrieve a quantum job.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: quantum-engine-jobs.getjob
      with:
        projectId: tools.projectId
        programId: tools.programId
        jobId: tools.jobId
      outputParameters:
      - type: object
        mapping: $.
    - name: quantum-engine-cancel-job
      description: Cancel a queued or running quantum job.
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: quantum-engine-jobs.canceljob
      with:
        projectId: tools.projectId
        programId: tools.programId
        jobId: tools.jobId
      outputParameters:
      - type: object
        mapping: $.
    - name: quantum-engine-get-result
      description: Retrieve the result of a completed quantum job.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: quantum-engine-jobs.getresult
      with:
        projectId: tools.projectId
        programId: tools.programId
        jobId: tools.jobId
      outputParameters:
      - type: object
        mapping: $.
    - name: quantum-engine-list-events
      description: List lifecycle events for a quantum job.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: quantum-engine-jobs.listevents
      with:
        projectId: tools.projectId
        programId: tools.programId
        jobId: tools.jobId
      outputParameters:
      - type: object
        mapping: $.
